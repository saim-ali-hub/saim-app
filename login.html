<!DOCTYPE html>
<html>
<head>
  <title>Linux Lab Login</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css"/>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial;
      color: white;
    }

    #loginBox {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111827;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
    }

    button {
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      background: #2563eb;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<div id="loginBox">
  <h2>Linux Lab Login</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login & Open Terminal</button>
</div>

<script>
async function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (!username || !password) {
        alert("Enter username and password");
        return;
    }

    const res = await fetch("http://192.168.100.78:8000/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();

    if (!data.token) {
        alert("Login failed");
        return;
    }

    // OPEN TERMINAL WITH USER
    localStorage.setItem("lab_user", username);

    window.location.href = "/";
	
}

</script>

</body>
</html>
